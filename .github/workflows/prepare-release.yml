name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part to bump"
        type: choice
        required: true
        default: rc
        options:
          - rc
          - patch
          - minor
          - major

jobs:
  prepare:
    name: Create Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          # Determine current base version (X.Y.Z) from the package version
          CURRENT=$(grep -oP 'package wasi:webgpu@\K[^;]+' wit/imports.wit)
          BASE="${CURRENT%%-rc.*}"
          if [[ ! "$BASE" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Error: Could not determine base version from '$CURRENT'"
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"

          # Compute the target base version for the requested bump.
          # rc keeps the same base and just increments the RC number;
          # patch/minor/major move to a new base and restart at rc.1.
          case "$BUMP" in
            rc)    ;;
            patch) PATCH=$((PATCH + 1)) ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            *) echo "Error: Unknown bump type '$BUMP'"; exit 1 ;;
          esac
          BASE="${MAJOR}.${MINOR}.${PATCH}"

          # Find highest RC number from existing tags for this base version
          HIGHEST_RC=0
          for tag in $(git tag -l "v${BASE}-rc.*"); do
            if [[ "$tag" =~ ^v${BASE}-rc\.([0-9]+)$ ]]; then
              RC_NUM="${BASH_REMATCH[1]}"
              if [ "$RC_NUM" -gt "$HIGHEST_RC" ]; then
                HIGHEST_RC="$RC_NUM"
              fi
            fi
          done

          NEXT_RC=$((HIGHEST_RC + 1))
          VERSION="${BASE}-rc.${NEXT_RC}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Preparing version: $VERSION"

      - name: Bump package version
        run: |
          # Update package version (matches wasi:webgpu@ANY_VERSION)
          find wit -type f -name "*.wit" -exec sed -i \
            "s/\(wasi:webgpu@\)[^;]*/\1${{ steps.version.outputs.version }}/g" {} +

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          commit-message: "chore: bump version to ${{ steps.version.outputs.version }}"
          branch: release/${{ steps.version.outputs.version }}
          title: "Release ${{ steps.version.outputs.version }}"
          body: |
            Bumps package version to `${{ steps.version.outputs.version }}`.

            Once merged, manually run the **Publish Release** workflow to:
            - Create git tag `v${{ steps.version.outputs.version }}`
            - Create GitHub release
            - Publish to `ghcr.io/webassembly/wasi/webgpu:${{ steps.version.outputs.version }}`
